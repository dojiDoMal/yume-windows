{
  // Project-level renderer configuration, read once at boot.
  "renderer": {
    // Graphics backend to use.
    // Options: "opengl" | "vulkan" | "directx12" | "webgl"
    // (aliases: gl, vk, d3d12/dx12/directx)
    "api": "vulkan",

    // Output color space.
    //   false = linear/UNORM (default): colors written as-is (all backends match)
    //   true  = sRGB: GPU applies linear->sRGB on write (output looks brighter)
    // Note: phase 1 only affects OUTPUT; input colors (.scn/textures) are not
    // reinterpreted as sRGB yet.
    "srgb": false,

    // Vertical sync.
    //   true  = cap to display refresh rate (default)
    //   false = uncapped (may tear, higher FPS)
    "vsync": true
  }
}
